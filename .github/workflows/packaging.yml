name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published version (empty tests the pinned v0.8.0 fixture)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  packaging:
    if: github.repository == 'crmne/spotifast'
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@f002ce91c1180528734538fa47d235d387fd351f # v0.6.0
    with:
      targets: linux-amd64,linux-arm64
      # Packaging changes exercise real release binaries on both architectures.
      # Update this fixture deliberately; releases use their own tag instead.
      version: ${{ inputs.version || 'v0.8.0' }}
      publish: ${{ inputs.publish == true && inputs.version != '' }}
    secrets: inherit

  installation:
    if: github.repository == 'crmne/spotifast'
    name: Install (${{ matrix.os }}, ${{ matrix.image }})
    needs: packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['ubuntu:24.04', 'debian:13-slim', 'fedora:41', 'fedora:latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Download the old package for replacement checks
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          case "$(uname -m)" in
            x86_64) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64) deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          case "$IMAGE" in
            ubuntu:*|debian:*) file="fastpotify_0.8.0_${deb_arch}.deb" ;;
            fedora:*) file="fastpotify-0.8.0-1.${rpm_arch}.rpm" ;;
          esac
          mkdir -p dist/legacy
          gh release download v0.8.0 --repo "$GITHUB_REPOSITORY" \
            --pattern "$file" --dir dist/legacy
          cp packaging/fixtures/fastpotify-0.8.0-checksums.txt dist/legacy/packaging-checksums.txt
          cd dist/legacy
          awk -v file="$file" '$2 == file { print }' packaging-checksums.txt > input-checksum.txt
          test -s input-checksum.txt
          sha256sum --check input-checksum.txt
      - name: Release filename regression checks
        run: python3 packaging/test-release-names.py
      - name: Install and check runtime libraries in a clean container
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE_VERSION: ${{ inputs.version || 'v0.8.0' }}
        run: |
          # The immutable 0.8.0 fixture still has its original window identity.
          case "$PACKAGE_VERSION" in
            v0.8.0|0.8.0) desktop_id=fastpotify ;;
            *) desktop_id=spotifast ;;
          esac
          bash packaging/test-install.sh "$IMAGE" dist/native-packages dist/legacy "$desktop_id"
