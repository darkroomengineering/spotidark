name: Release desktop apps

# CI calls this after every successful main build. A direct manual run builds
# the same two installers for review but never publishes them.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.publish && 'spotidark-release-publication' || format('spotidark-release-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  identity:
    name: Validate release identity
    if: >-
      github.repository == 'darkroomengineering/spotidark' &&
      github.ref == 'refs/heads/main' &&
      (!inputs.publish || github.workflow == 'CI')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify caller and current main
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/.test(target)) {
              core.setFailed(`Release SHA is not canonical: ${target}`);
              return;
            }

            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Release builds must run from main.');
              return;
            }
            if (process.env.PUBLISH === 'true' &&
                !['push', 'workflow_dispatch'].includes(context.eventName)) {
              core.setFailed('Only the main CI push or manual CI build may publish.');
              return;
            }

            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.data.object.sha !== target) {
              core.setFailed(`Release SHA ${target} is no longer current main ${main.data.object.sha}.`);
            }

      - name: Derive release version
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(python3 packaging/release.py version "$RELEASE_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Manual runs upload build-only artifacts and never publish a release.'
          fi

  macos:
    name: macOS universal DMG
    needs: identity
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    env:
      CMAKE_GENERATOR: Ninja
      VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Stamp the ephemeral build version
        run: |
          python3 packaging/release.py stamp "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: spotidark-macos-universal

      - name: Select signing mode
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          complete=true
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then complete=false; fi
          done
          if [ "$complete" = true ]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=ad-hoc' >> "$GITHUB_OUTPUT"
            echo '::warning::Apple credentials are missing or incomplete. The macOS DMG will be public, ad-hoc signed, and not notarized.'
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/spotidark-signing.keychain-db"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotidark-cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/spotidark-cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build universal Spotidark app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --bin spotidark
          cargo build --locked --release --target x86_64-apple-darwin --bin spotidark
          mkdir -p universal payload
          lipo -create \
            target/aarch64-apple-darwin/release/spotidark \
            target/x86_64-apple-darwin/release/spotidark \
            -output universal/fastpotify
          if [ "$SIGNING_MODE" = developer-id ]; then
            export CODESIGN_IDENTITY="$APPLE_SIGNING_IDENTITY"
          else
            unset CODESIGN_IDENTITY
          fi
          bash packaging/macos/bundle.sh universal/fastpotify payload/Spotidark.app "$VERSION"
          codesign --verify --deep --strict --verbose=2 payload/Spotidark.app

      - name: Notarize and staple app
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spotidark-app-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent payload/Spotidark.app "$archive"
          response="$(xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          request_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          if [ "$status" != Accepted ]; then
            echo "App notarization failed with status: $status" >&2
            xcrun notarytool log "$request_id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple payload/Spotidark.app
          xcrun stapler validate payload/Spotidark.app
          spctl -a -vv --type execute payload/Spotidark.app

      - name: Create DMG
        run: |
          mkdir dist
          ruby packaging/macos/dmg.rb payload dist/spotidark-macos.dmg

      - name: Sign, notarize and assess DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=dist/spotidark-macos.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          response="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          request_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          if [ "$status" != Accepted ]; then
            echo "DMG notarization failed with status: $status" >&2
            xcrun notarytool log "$request_id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv --type open --context context:primary-signature "$dmg"

      - name: Verify macOS artifact
        run: python3 packaging/release.py verify-assets dist spotidark-macos.dmg

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/spotidark-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/spotidark-cert.p12" "$RUNNER_TEMP/spotidark-app-notary.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: spotidark-macos
          path: dist/spotidark-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    needs: identity
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
      VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Stamp the ephemeral build version
        shell: bash
        run: |
          python3 packaging/release.py stamp "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: spotidark-windows-x64

      - name: Select signing mode
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          complete=true
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then complete=false; fi
          done
          if [ "$complete" = true ]; then
            echo 'mode=authenticode' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=unsigned' >> "$GITHUB_OUTPUT"
            echo '::warning::Azure Artifact Signing credentials are missing or incomplete. The Windows installer will not be Authenticode signed and SmartScreen will warn on first launch.'
          fi

      - name: Build Spotidark
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin spotidark

      - name: Install Azure Artifact Signing CLI
        if: steps.signing.outputs.mode == 'authenticode'
        shell: pwsh
        # dotnet/sign ships prerelease-tagged versions only; pin one so the
        # release build does not change under us.
        run: dotnet tool install --tool-path "$env:GITHUB_WORKSPACE\.signtool" --version 0.9.1-beta.26431.1 sign

      - name: Sign Spotidark binary
        if: steps.signing.outputs.mode == 'authenticode'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGN_TOOL_DIR: ${{ github.workspace }}\.signtool
        run: pwsh -File packaging\windows\sign.ps1 target\x86_64-pc-windows-msvc\release\spotidark.exe

      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\x86_64-pc-windows-msvc\release\spotidark.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotidark imports an MSVC runtime:`n$runtime" }

      - name: Build installer
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGN_TOOL_DIR: ${{ github.workspace }}\.signtool
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          # When signing, Inno Setup calls sign.ps1 on the installer, the
          # embedded uninstaller and the program, so every executable a user
          # runs carries the same signature (Smart App Control checks all three).
          $signing = @()
          if ($env:SIGNING_MODE -eq 'authenticode') {
            $signing = @('/DSign', "/Sazure=pwsh -NoProfile -File `$q$PWD\packaging\windows\sign.ps1`$q `$f")
          }
          & $iscc "/DVersion=$env:VERSION" "/DArch=x86_64" `
            "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\spotidark.exe" `
            "/DOutputDir=$PWD\dist" @signing packaging\windows\fastpotify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.mode == 'authenticode'
        shell: pwsh
        run: |
          foreach ($file in @("target\x86_64-pc-windows-msvc\release\spotidark.exe", "dist\spotidark-windows.exe")) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file signature status: $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "$file is signed but not timestamped" }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }
          # The uninstaller only exists once installed: run the installer
          # silently on the runner and check what it wrote.
          $target = "$env:LOCALAPPDATA\Programs\Spotidark"
          Start-Process -Wait -FilePath "dist\spotidark-windows.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $uninstaller = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "no uninstaller found in $target" }
          $signature = Get-AuthenticodeSignature $uninstaller.FullName
          if ($signature.Status -ne 'Valid') { throw "uninstaller signature status: $($signature.Status)" }
          Write-Host "$($uninstaller.Name) signed by $($signature.SignerCertificate.Subject)"
          Start-Process -Wait -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'

      - name: Verify Windows artifact
        shell: bash
        run: python3 packaging/release.py verify-assets dist spotidark-windows.exe

      - uses: actions/upload-artifact@v7
        with:
          name: spotidark-windows
          path: dist/spotidark-windows.exe
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub release
    needs: [identity, macos, windows]
    if: needs.identity.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      MACOS_SIGNING_MODE: ${{ needs.macos.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: spotidark-macos
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: spotidark-windows
          path: dist

      - name: Verify publication state
        id: state
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.data.object.sha !== process.env.RELEASE_SHA) {
              core.setFailed(
                `Release SHA ${process.env.RELEASE_SHA} is no longer current main ${main.data.object.sha}.`
              );
              return '';
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setFailed(`Release ${process.env.RELEASE_TAG} already exists and cannot be replaced.`);
              return '';
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
              });
              core.setFailed(`Tag ${process.env.RELEASE_TAG} already exists and will not be moved.`);
              return '';
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return latest.data.tag_name;
            } catch (error) {
              if (error.status === 404) return '';
              throw error;
            }

      - name: Verify release order and assets
        env:
          LATEST_TAG: ${{ steps.state.outputs.result }}
        run: |
          set -euo pipefail
          if [ -n "$LATEST_TAG" ]; then
            python3 packaging/release.py require-newer "$RELEASE_VERSION" "$LATEST_TAG"
          fi
          python3 packaging/release.py verify-assets dist spotidark-macos.dmg spotidark-windows.exe

      - name: Upload a private draft
        run: |
          set -euo pipefail
          {
            echo "Spotidark $RELEASE_VERSION"
            echo
            echo "Built from commit $RELEASE_SHA after its successful main-branch CI run."
            echo
            if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
              echo "The macOS DMG is Developer ID signed, notarized, and stapled."
            else
              echo "The macOS DMG is ad-hoc signed and not notarized. Apple Developer signing is pending."
            fi
            echo
            echo "Spotidark is based on Spotifast by Carmine Paolino and contributors. The original MIT license and upstream credits are included in both installers."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            dist/spotidark-macos.dmg \
            dist/spotidark-windows.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Spotidark $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft

      - name: Verify uploaded bytes and publish current main
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            // A new draft has no tag ref yet, so the by-tag endpoint returns 404.
            const drafts = (await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })).filter(candidate => candidate.tag_name === process.env.RELEASE_TAG);
            if (drafts.length !== 1) {
              throw new Error('Expected exactly one release draft for this version.');
            }
            const release = {data: drafts[0]};
            if (!release.data.draft || release.data.target_commitish !== process.env.RELEASE_SHA) {
              throw new Error('Only the draft for this exact tested commit can be published.');
            }
            const expected = ['spotidark-macos.dmg', 'spotidark-windows.exe'];
            const assets = release.data.assets.slice().sort((a, b) => a.name.localeCompare(b.name));
            if (assets.map(asset => asset.name).join('\n') !== expected.join('\n')) {
              core.setFailed(
                `Draft assets must be exactly ${expected.join(', ')}; found ${assets.map(a => a.name).join(', ')}.`
              );
              return;
            }
            for (const asset of assets) {
              const path = `dist/${asset.name}`;
              const hash = crypto.createHash('sha256');
              for await (const chunk of fs.createReadStream(path)) hash.update(chunk);
              const digest = `sha256:${hash.digest('hex')}`;
              if (asset.state !== 'uploaded' || asset.size !== fs.statSync(path).size || asset.digest !== digest) {
                throw new Error(`GitHub's uploaded bytes do not match the verified ${asset.name}.`);
              }
            }

            // Uploads may take minutes. Recheck state after upload, before users
            // can discover this release or its updater metadata.
            try {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              execFileSync('python3', ['packaging/release.py', 'require-newer',
                process.env.RELEASE_VERSION, latest.data.tag_name]);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const tag = await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
              });
              if (tag.data.object.sha !== process.env.RELEASE_SHA) {
                throw new Error('The release tag does not identify the tested commit.');
              }
            } catch (error) {
              // GitHub can defer creating a draft's tag until publication.
              if (error.status !== 404) throw error;
            }
            const main = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main',
            });
            if (main.data.object.sha !== process.env.RELEASE_SHA) {
              throw new Error('Main changed during upload. Keep this draft private.');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.data.id, draft: false, make_latest: 'true',
            });

      - name: Verify published tag, latest release, and prune prior Spotidark versions
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        with:
          script: |
            const current = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            if (current.data.draft || current.data.prerelease) {
              throw new Error('The new Spotidark release is not public and stable.');
            }
            const tag = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            if (tag.data.object.sha !== process.env.RELEASE_SHA) {
              throw new Error('The new release tag does not identify the tested commit.');
            }

            let latest;
            for (let attempt = 0; attempt < 5; attempt += 1) {
              latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (latest.data.id === current.data.id) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (latest.data.id !== current.data.id) {
              throw new Error('The new release did not become /releases/latest. Prior releases were retained.');
            }

            const canonical = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!canonical.test(current.data.tag_name)) {
              throw new Error('The current Spotidark release tag is not canonical.');
            }
            const version = tag => tag.slice(1).split('.').map(part => BigInt(part));
            const currentVersion = version(current.data.tag_name);
            const olderThanCurrent = tag => {
              const candidate = version(tag);
              for (let index = 0; index < currentVersion.length; index += 1) {
                if (candidate[index] < currentVersion[index]) return true;
                if (candidate[index] > currentVersion[index]) return false;
              }
              return false;
            };
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const release of releases) {
              if (release.id === current.data.id || release.draft || release.prerelease ||
                  !canonical.test(release.tag_name) ||
                  !olderThanCurrent(release.tag_name) ||
                  release.name !== `Spotidark ${release.tag_name.slice(1)}`) {
                continue;
              }
              core.info(`Deleting prior Spotidark release ${release.tag_name}; its tag is retained.`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }

            const confirmed = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (confirmed.data.id !== current.data.id) {
              throw new Error('The current Spotidark release is no longer /releases/latest.');
            }
