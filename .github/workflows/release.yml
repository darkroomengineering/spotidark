name: Release desktop apps

# Every successful push CI run on current main publishes one immutable release.
# Manual runs build the same two installers for review but never publish them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: spotidark-release-${{ github.event_name == 'workflow_run' && 'publication' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  identity:
    name: Validate release identity
    if: >-
      github.repository == 'darkroomengineering/spotidark' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tested revision
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Verify CI provenance and current main
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        with:
          script: |
            const target = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/.test(target)) {
              core.setFailed(`Release SHA is not canonical: ${target}`);
              return;
            }

            if (context.eventName === 'workflow_run') {
              const upstream = context.payload.workflow_run;
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: upstream.id,
              });
              const workflow = await github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: upstream.workflow_id,
              });
              if (run.data.conclusion !== 'success' ||
                  !['push', 'workflow_dispatch'].includes(run.data.event) ||
                  run.data.head_branch !== 'main' || run.data.head_sha !== target ||
                  workflow.data.name !== 'CI' || workflow.data.path !== '.github/workflows/ci.yml') {
                core.setFailed('The upstream run is not successful push CI for this exact main commit.');
                return;
              }
              if (run.data.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  run.data.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed('The upstream CI run does not belong to this repository.');
                return;
              }
            } else if (context.ref !== 'refs/heads/main') {
              core.setFailed('Manual release builds must run from main.');
              return;
            }

            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.data.object.sha !== target) {
              core.setFailed(`Release SHA ${target} is no longer current main ${main.data.object.sha}.`);
            }

      - name: Derive release version
        id: release
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(python3 packaging/release.py version "$GITHUB_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Manual runs upload build-only artifacts and never publish a release.'
          fi

  macos:
    name: macOS universal DMG
    needs: identity
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
      VERSION: ${{ needs.identity.outputs.version }}
      AUTO_PUBLISH: ${{ needs.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Stamp the ephemeral build version
        run: |
          python3 packaging/release.py stamp "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: spotidark-macos-universal

      - name: Select signing mode
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          complete=true
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then complete=false; fi
          done
          if [ "$complete" = true ]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
            echo 'artifact_name=spotidark-macos' >> "$GITHUB_OUTPUT"
          elif [ "$AUTO_PUBLISH" = true ]; then
            echo 'All six Apple signing and notarization secrets are required for publication.' >&2
            exit 1
          else
            echo 'mode=ad-hoc' >> "$GITHUB_OUTPUT"
            echo 'artifact_name=spotidark-macos-ad-hoc-dry-run' >> "$GITHUB_OUTPUT"
            echo '::notice::Apple credentials are incomplete. This build-only DMG is ad-hoc signed and cannot be published.'
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/spotidark-signing.keychain-db"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotidark-cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/spotidark-cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build universal Spotidark app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --bin spotidark
          cargo build --locked --release --target x86_64-apple-darwin --bin spotidark
          mkdir -p universal payload
          lipo -create \
            target/aarch64-apple-darwin/release/spotidark \
            target/x86_64-apple-darwin/release/spotidark \
            -output universal/fastpotify
          if [ "$SIGNING_MODE" = developer-id ]; then
            export CODESIGN_IDENTITY="$APPLE_SIGNING_IDENTITY"
          else
            unset CODESIGN_IDENTITY
          fi
          bash packaging/macos/bundle.sh universal/fastpotify payload/Spotidark.app "$VERSION"
          codesign --verify --deep --strict --verbose=2 payload/Spotidark.app

      - name: Notarize and staple app
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spotidark-app-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent payload/Spotidark.app "$archive"
          response="$(xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          request_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          if [ "$status" != Accepted ]; then
            echo "App notarization failed with status: $status" >&2
            xcrun notarytool log "$request_id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple payload/Spotidark.app
          xcrun stapler validate payload/Spotidark.app
          spctl -a -vv --type execute payload/Spotidark.app

      - name: Create DMG
        run: |
          mkdir dist
          ruby packaging/macos/dmg.rb payload dist/spotidark-macos.dmg

      - name: Sign, notarize and assess DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=dist/spotidark-macos.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          response="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          request_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          if [ "$status" != Accepted ]; then
            echo "DMG notarization failed with status: $status" >&2
            xcrun notarytool log "$request_id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv --type open --context context:primary-signature "$dmg"

      - name: Verify macOS artifact
        run: python3 packaging/release.py verify-assets dist spotidark-macos.dmg

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/spotidark-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/spotidark-cert.p12" "$RUNNER_TEMP/spotidark-app-notary.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: dist/spotidark-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    needs: identity
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
      VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Stamp the ephemeral build version
        shell: bash
        run: |
          python3 packaging/release.py stamp "$VERSION"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: spotidark-windows-x64

      - name: Build Spotidark
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin spotidark

      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\x86_64-pc-windows-msvc\release\spotidark.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotidark imports an MSVC runtime:`n$runtime" }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$env:VERSION" "/DArch=x86_64" `
            "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\spotidark.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\fastpotify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows artifact
        shell: bash
        run: python3 packaging/release.py verify-assets dist spotidark-windows.exe

      - uses: actions/upload-artifact@v7
        with:
          name: spotidark-windows
          path: dist/spotidark-windows.exe
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub release
    needs: [identity, macos, windows]
    if: needs.identity.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: spotidark-macos
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: spotidark-windows
          path: dist

      - name: Verify publication state
        id: state
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.data.object.sha !== process.env.RELEASE_SHA) {
              core.setFailed(
                `Release SHA ${process.env.RELEASE_SHA} is no longer current main ${main.data.object.sha}.`
              );
              return '';
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setFailed(`Release ${process.env.RELEASE_TAG} already exists and cannot be replaced.`);
              return '';
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
              });
              core.setFailed(`Tag ${process.env.RELEASE_TAG} already exists and will not be moved.`);
              return '';
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return latest.data.tag_name;
            } catch (error) {
              if (error.status === 404) return '';
              throw error;
            }

      - name: Verify release order and assets
        env:
          LATEST_TAG: ${{ steps.state.outputs.result }}
        run: |
          set -euo pipefail
          if [ -n "$LATEST_TAG" ]; then
            python3 packaging/release.py require-newer "$RELEASE_VERSION" "$LATEST_TAG"
          fi
          python3 packaging/release.py verify-assets dist spotidark-macos.dmg spotidark-windows.exe

      - name: Upload a private draft
        run: |
          set -euo pipefail
          {
            echo "Spotidark $RELEASE_VERSION"
            echo
            echo "Built from commit $RELEASE_SHA after its successful main-branch CI run."
            echo
            echo "Spotidark is based on Spotifast by Carmine Paolino and contributors. The original MIT license and upstream credits are included in both installers."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            dist/spotidark-macos.dmg \
            dist/spotidark-windows.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Spotidark $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft

      - name: Verify uploaded bytes and publish current main
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            if (!release.data.draft || release.data.target_commitish !== process.env.RELEASE_SHA) {
              throw new Error('Only the draft for this exact tested commit can be published.');
            }
            const expected = ['spotidark-macos.dmg', 'spotidark-windows.exe'];
            const assets = release.data.assets.slice().sort((a, b) => a.name.localeCompare(b.name));
            if (assets.map(asset => asset.name).join('\n') !== expected.join('\n')) {
              core.setFailed(
                `Draft assets must be exactly ${expected.join(', ')}; found ${assets.map(a => a.name).join(', ')}.`
              );
              return;
            }
            for (const asset of assets) {
              const path = `dist/${asset.name}`;
              const hash = crypto.createHash('sha256');
              for await (const chunk of fs.createReadStream(path)) hash.update(chunk);
              const digest = `sha256:${hash.digest('hex')}`;
              if (asset.state !== 'uploaded' || asset.size !== fs.statSync(path).size || asset.digest !== digest) {
                throw new Error(`GitHub's uploaded bytes do not match the verified ${asset.name}.`);
              }
            }

            // Uploads may take minutes. Recheck state after upload, before users
            // can discover this release or its updater metadata.
            try {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              execFileSync('python3', ['packaging/release.py', 'require-newer',
                process.env.RELEASE_VERSION, latest.data.tag_name]);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const tag = await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
              });
              if (tag.data.object.sha !== process.env.RELEASE_SHA) {
                throw new Error('The release tag does not identify the tested commit.');
              }
            } catch (error) {
              // GitHub can defer creating a draft's tag until publication.
              if (error.status !== 404) throw error;
            }
            const main = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main',
            });
            if (main.data.object.sha !== process.env.RELEASE_SHA) {
              throw new Error('Main changed during upload. Keep this draft private.');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.data.id, draft: false, make_latest: 'true',
            });

      - name: Verify published tag
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$tag_sha" = "$RELEASE_SHA"
